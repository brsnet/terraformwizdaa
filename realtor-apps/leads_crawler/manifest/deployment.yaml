apiVersion: apps/v1
kind: Deployment
metadata:
  name: leads_crawler
  namespace: realtor-apps
  labels:
    app: leads_crawler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: leads_crawler
  template:
    metadata:
      labels:
        app: leads_crawler
    spec:
      containers:
        - name: leads_crawler
          image: crawler_leads-crawler:latest
          ports:
            - containerPort: 7001
          envFrom:
            - secretRef:
                name: leads_crawler-env
